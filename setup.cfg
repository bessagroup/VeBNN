[metadata]
name = VeBNN
version = file: VERSION
author = Jiaxiang Yi
author_email = J.Yi@tudelft.nl
description = Cooperative variance estimation and Bayesian neural networks disentangle aleatoric and epistemic uncertainties
long_description = file: README.md
long_description_content_type = text/markdown
keywords = Bayesian neural networks, Cooperative learning, Uncertainty disentanglement
url = https://github.com/bessagroup/VeBNN
license = BSD-3-Clause License
license_files = file: LICENSE
classifiers =
  Intended Audience :: Science/Research
  Topic :: Scientific/Engineering
  Topic :: Scientific/Engineering :: Artificial Intelligence
  Topic :: Scientific/Engineering :: Physics
  License :: OSI Approved :: BSD License
  Natural Language :: English
  Programming Language :: Python :: 3

[options]
package_dir=
  =src
packages=find:
include_package_data = True
python_requires = >=3.8
install_requires = file: requirements.txt


[options.packages.find]
where=src